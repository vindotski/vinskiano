#cloud-config
# Vinskiano server bootstrap. Works on any provider with cloud-init user data
# (DigitalOcean, Hetzner, Vultr, Linode, AWS, ...) on Ubuntu 22.04/24.04 or
# Debian 12/13, amd64 or arm64. Paste it into the provider's "user data" field
# when creating the server. Installs Docker, a firewall, automatic security
# updates, and a `deploy` user for the GitHub deploy workflow. See docs/deploy-single-server.md.

package_update: true
package_upgrade: true
# A kernel update in the first upgrade only applies after a reboot.
package_reboot_if_required: true
# Belt and braces with the sshd drop-in below: cloud-init's own SSH setting
# (Ubuntu's 50-cloud-init.conf) must not turn password logins back on.
ssh_pwauth: false
packages:
  - ca-certificates
  - curl
  - ufw
  - unattended-upgrades

users:
  - default
  - name: deploy
    shell: /bin/bash
    lock_passwd: true

write_files:
  # Keep container logs from filling the disk; keep containers running while
  # Docker itself is upgraded (live-restore); no container may gain privileges
  # (setuid etc.); published ports go through the kernel, not a proxy process.
  - path: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "3" },
        "live-restore": true,
        "no-new-privileges": true,
        "userland-proxy": false
      }
  # Key-only SSH. Root keeps key login for admin work (reboots, upgrades):
  # `deploy` has no sudo, and disabling root too would lock everyone out.
  # sshd uses the *first* value it reads for each setting, so this file must
  # sort before the distribution's own drop-ins (Ubuntu's 50-cloud-init.conf).
  - path: /etc/ssh/sshd_config.d/00-vinskiano.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
      MaxAuthTries 3
      LoginGraceTime 30
      X11Forwarding no
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
  # Security updates also cover Docker (its own apt repository), and the
  # server reboots at 04:00 when an update needs it (kernel, libc). Containers
  # come back by themselves (restart: unless-stopped).
  - path: /etc/apt/apt.conf.d/52vinskiano-upgrades
    content: |
      Unattended-Upgrade::Origins-Pattern { "origin=Docker"; };
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "04:00";

runcmd:
  # Docker Engine + compose plugin from Docker's official apt repository
  # (the repo path follows the distribution: linux/ubuntu or linux/debian).
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL "https://download.docker.com/linux/$(. /etc/os-release && echo "$ID")/gpg" -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - >-
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc]
    https://download.docker.com/linux/$(. /etc/os-release && echo "$ID") $(. /etc/os-release && echo "$VERSION_CODENAME") stable"
    > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker

  # deploy user: Docker access + the SSH keys you picked when creating the server.
  # Providers put those keys in different places (root on most, the image's
  # default user such as `ubuntu` on AWS), so collect them from every account.
  # Only the bare key is copied: AWS prefixes root's keys with a forced
  # "Please login as ubuntu" command that would otherwise break `deploy` logins.
  - usermod -aG docker deploy
  - install -d -m 0700 -o deploy -g deploy /home/deploy/.ssh
  - |
    cat /root/.ssh/authorized_keys /home/*/.ssh/authorized_keys 2>/dev/null \
      | grep -ohE '(ssh-(ed25519|rsa|dss)|ecdsa-sha2-nistp[0-9]+|sk-(ssh-ed25519|ecdsa-sha2-nistp256)@openssh\.com) [A-Za-z0-9+/=]+' \
      | sort -u > /home/deploy/.ssh/authorized_keys
    chown deploy:deploy /home/deploy/.ssh/authorized_keys
    chmod 0600 /home/deploy/.ssh/authorized_keys
    [ -s /home/deploy/.ssh/authorized_keys ] || echo "WARNING: no SSH keys found for the deploy user; add one to /home/deploy/.ssh/authorized_keys" >&2
  - install -d -m 0755 -o deploy -g deploy /opt/vinskiano

  # 1 GB of swap (unless the provider set some up): a memory spike slows the
  # server down instead of waking the out-of-memory killer.
  - |
    if [ -z "$(swapon --show --noheadings)" ]; then
      fallocate -l 1G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile \
        && echo '/swapfile none swap sw 0 0' >> /etc/fstab
    fi

  # Firewall: SSH + HTTP(S) only (443/udp is HTTP/3). SSH is rate-limited
  # (6 new connections in 30 s per address), which slows password guessing bots.
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw limit OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw allow 443/udp
  - ufw --force enable

  - systemctl restart ssh
