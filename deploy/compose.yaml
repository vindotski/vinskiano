# Vinskiano on a single server: the app image behind Caddy (automatic HTTPS).
# Lives in /opt/vinskiano on the server, next to Caddyfile and .env.
# The deploy workflow copies this file over on every deploy, so edit it here.
name: vinskiano

services:
  app:
    image: ${VINSKIANO_IMAGE:-vindotski/vinskiano}:${VINSKIANO_TAG:?set VINSKIANO_TAG in .env}
    restart: unless-stopped
    # No published ports: only Caddy reaches the app, on the internal network.
    # The image's HEALTHCHECK fetches / so `docker compose up --wait` really waits.
    environment:
      NODE_OPTIONS: --max-old-space-size=${APP_NODE_HEAP_MB:-192}
    stop_grace_period: 10s
    # Hardening. The server only renders pages and serves files: it writes nothing, so the
    # filesystem is read-only; /tmp is a small in-memory scratch space.
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: ${APP_MEMORY:-384m}
    cpus: ${APP_CPUS:-1}
    pids_limit: 128
    ulimits:
      nofile: { soft: 4096, hard: 4096 }

  caddy:
    image: caddy:2.11.7@sha256:36c24ad91a7ff7bc4c87fe22bfa8df3c4b18da0773d73fc12ee2c52b98c0bb7e
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=8m,noexec,nosuid,nodev
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE] # ports 80 and 443
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      VINSKIANO_DOMAIN: ${VINSKIANO_DOMAIN:?set VINSKIANO_DOMAIN in .env}
    # Without a healthcheck, `docker compose up --wait` treats a crash-looping Caddy as
    # "running"; the admin API only answers once the config has loaded.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates: keep across redeploys
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
