# Checks every push to dev/main and every pull request.
# Actions are pinned to commit SHAs (version in the comment); Dependabot keeps them current.
name: CI

on:
  push:
    branches: [dev, main]
    tags: ["v*.*.*"]
  pull_request:

# Read-only by default; no job needs more.
permissions:
  contents: read

# A newer push to a PR or dev cancels the run still going. main and tags never cancel: a quick
# second merge to main must not stop the first one's publish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/dev' }}

jobs:
  check:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The quick checks first, so a lint or type error fails before Postgres starts.
      - run: pnpm exec biome ci
      - run: pnpm typecheck
      # The only build of the app in this run: the browser test jobs start this .output/.
      # It needs no settings (the startup check is skipped while prerendering).
      - run: pnpm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-build
          path: .output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      # Guest accounts need Postgres with Spotcraft's auth schema: the same local stack as on a
      # laptop (Docker), with DATABASE_URL and AUTH_SECRET written to .env.
      - run: pnpm exec spotcraft dev start && pnpm exec spotcraft dev env --write
      - run: pnpm test

  e2e:
    name: Browser tests (${{ matrix.browser }})
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            projects: chromium pixel-portrait pixel-landscape
          - browser: firefox
            projects: firefox
            # Firefox only runs Web Audio with an audio output; CI machines have none.
            virtual-audio: true
          - browser: webkit
            projects: webkit iphone-portrait iphone-landscape
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Guest accounts need Postgres with Spotcraft's auth schema: the same local stack as on a
      # laptop (Docker), with DATABASE_URL and AUTH_SECRET written to .env.
      - run: pnpm exec spotcraft dev start && pnpm exec spotcraft dev env --write
      # Browsers are cached per Playwright version; their system packages (apt) are not.
      - id: playwright
        run: echo "version=$(jq -r .version node_modules/@playwright/test/package.json)" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps "$BROWSER"
        env:
          BROWSER: ${{ matrix.browser }}
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps "$BROWSER"
        env:
          BROWSER: ${{ matrix.browser }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-build
          path: .output
      - name: Add a virtual audio output (PulseAudio null sink)
        if: matrix.virtual-audio
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci
          pactl set-default-sink ci
      # Starts the production server from check's build (E2E_PREBUILT in playwright.config.ts).
      - run: |
          read -ra projects <<< "$PROJECTS"
          pnpm exec playwright test "${projects[@]/#/--project=}"
        env:
          PROJECTS: ${{ matrix.projects }}
          E2E_PREBUILT: 1
      # The HTML report, and traces of failed tests (test-results/), to download and open.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    name: Docker image (browser tests, vulnerability scan)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # compose names the app service's image <project>-app; the build below tags it so.
      COMPOSE_PROJECT_NAME: vinskiano
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Guest accounts need Postgres with Spotcraft's auth schema: the same local stack as on a
      # laptop (Docker), with DATABASE_URL and AUTH_SECRET written to .env.
      - run: pnpm exec spotcraft dev start && pnpm exec spotcraft dev env --write
      # Browsers are cached per Playwright version; their system packages (apt) are not.
      - id: playwright
        run: echo "version=$(jq -r .version node_modules/@playwright/test/package.json)" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps "$BROWSER"
        env:
          BROWSER: chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps "$BROWSER"
        env:
          BROWSER: chromium
      # The amd64 image publish would push, with the layer cache publish shares: the build
      # stages come from cache when nothing changed, the production stage is always rebuilt
      # (a fresh apt-get upgrade, like publish), so the scan below sees current packages.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: production
          load: true
          tags: vinskiano-app
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max
          no-cache-filters: production
      # Tests what would ship: compose runs the image just built (E2E_DOCKER and E2E_PREBUILT).
      - run: pnpm test:e2e:docker --project=chromium
        env:
          E2E_PREBUILT: 1
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-docker
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      # Fail on HIGH/CRITICAL vulnerabilities that have a fix. Trivy is pinned by digest.
      - name: Scan the image with Trivy
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
          image --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1
          vinskiano-app

  # Publishes vindotski/vinskiano to Docker Hub, only from main and version tags, and only
  # after every check above has passed. Spotcraft deploys these images (docs/deploy.md).
  # Needs the repository variable DOCKERHUB_USERNAME and the secret DOCKERHUB_TOKEN.
  publish:
    name: Publish image to Docker Hub
    needs: [check, e2e, docker]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A release tag must match package.json's version (bump it in the release commit first).
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          REF: ${{ github.ref }}
        run: |
          tag="${REF#refs/tags/v}"
          version="$(jq -r .version package.json)"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag doesn't match package.json version $version"
            exit 1
          fi

      # arm64 (e.g. Hetzner's Ampere servers) is built under QEMU emulation on the amd64 runner.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # main → latest; v1.2.3 → 1.2.3, 1.2 and 1; every publish → sha-abc1234.
      # (Not {{is_default_branch}}: the default branch is dev, which never publishes.)
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: vindotski/vinskiano
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=Vinskiano
            org.opencontainers.image.description=A three-oscillator synth that lives in your browser. https://vinskiano.app
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.url=https://vinskiano.app

      # Pushed by digest only, without tags: nobody pulls it until the scan below passes.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: production
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=vindotski/vinskiano,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max
          # Rebuild the production stage every time, so its apt-get upgrade picks up the
          # latest Debian security fixes instead of a cached layer (the build stages stay cached).
          no-cache-filters: production

      # The same scan as the docker job, on exactly what was pushed (its own apt-get upgrade),
      # for both platforms. Trivy reads the image from Docker Hub with the same credentials.
      - name: Scan the pushed image with Trivy
        env:
          IMAGE: vindotski/vinskiano@${{ steps.build.outputs.digest }}
          TRIVY_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            echo "::group::Trivy $platform"
            docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD \
              aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
              image --image-src remote --platform "$platform" \
              --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 "$IMAGE"
            echo "::endgroup::"
          done

      # Only now does the image get its tags (latest, the version, sha-…).
      - name: Tag the image
        env:
          IMAGE: vindotski/vinskiano@${{ steps.build.outputs.digest }}
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools create "${tags[@]/#/--tag=}" "$IMAGE"
