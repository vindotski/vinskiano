name: Deploy

# RETIRED: deploys a published image tag to the single server described in
# docs/deploy-single-server.md. That server has no database, so it can't run images with guest
# accounts; Vinskiano deploys on Spotcraft now (docs/deploy.md). Kept until the first Spotcraft
# deploy has worked, then removed with deploy/.
#
# It has no manual trigger any more, so nobody starts a deploy that can't work. workflow_call
# keeps the file valid without a trigger anyone uses (no workflow calls it).
on:
  workflow_call:
    inputs:
      tag:
        description: Image tag of vindotski/vinskiano to deploy (e.g. 1.0.0 or sha-abc1234)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://${{ vars.VINSKIANO_DOMAIN }}
    env:
      TAG: ${{ inputs.tag }}
      HOST: ${{ vars.DEPLOY_HOST }}
      USER_NAME: ${{ vars.DEPLOY_USER || 'deploy' }}
      DOMAIN: ${{ vars.VINSKIANO_DOMAIN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check inputs
        run: |
          # Image tags are letters, digits, dots, dashes and underscores.
          if [[ ! "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "::error::Invalid image tag: $TAG"
            exit 1
          fi
          if [ -z "$HOST" ] || [ -z "$DOMAIN" ]; then
            echo "::error::Set the DEPLOY_HOST and VINSKIANO_DOMAIN variables"
            exit 1
          fi
          # Fail fast if the tag was never published.
          docker manifest inspect "vindotski/vinskiano:$TAG" > /dev/null

      # Plain ssh/scp, no third-party action. The host key is pinned via a secret, so a
      # man-in-the-middle can't impersonate the server.
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host vinskiano\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  StrictHostKeyChecking yes\n' \
            "$HOST" "$USER_NAME" > ~/.ssh/config

      - name: Upload compose files
        run: scp deploy/compose.yaml deploy/Caddyfile vinskiano:/opt/vinskiano/

      - name: Roll out
        # The script runs on the server; TAG is passed as a safely quoted assignment.
        run: |
          { printf 'TAG=%q\n' "$TAG"; cat deploy/remote-deploy.sh; } | ssh vinskiano bash -s

      - name: Check the site from outside
        run: deploy/check-site.sh "https://$DOMAIN"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_deploy
