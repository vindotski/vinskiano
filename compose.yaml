# pnpm docker       production image (Node + Nitro) on http://localhost:${PORT:-3000}
# pnpm docker:dev   Vite dev server with hot reload, source bind-mounted
# pnpm docker:test  lint + typecheck + unit tests in the dev container
#
# All of them need Spotcraft's local stack first: `pnpm exec spotcraft dev` (Postgres, the user
# pool, the app's schema and its migrations).

# The stack's Postgres and user pool, reached by their service names on the stack's network (the
# 127.0.0.1 and localhost URLs in .env only work from the host). The password is the fixed local
# one `spotcraft dev` gives the app. The browser reaches the pool through the app's own
# /_spotcraft/auth (src/server/pool-proxy.ts).
x-spotcraft: &spotcraft
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgres://app_vinskiano:local-vinskiano-password@postgres:5432/apps
    DATABASE_SCHEMA: app_vinskiano
    PUBLIC_URL: http://localhost:${PORT:-3000}
    AUTH_URL: http://auth:3000/_spotcraft/auth
    AUTH_ISSUER: http://localhost/pools/main
    AUTH_JWKS_URL: http://auth:3000/_spotcraft/auth/jwks
  networks: [default, spotcraft]

services:
  app:
    <<: *spotcraft
    build:
      context: .
      target: production
    ports:
      - "${PORT:-3000}:3000"

  dev:
    <<: *spotcraft
    build:
      context: .
      target: dev
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/app
      # Linux node_modules live in a named volume, never mixed with the host's macOS ones.
      - node_modules:/app/node_modules
    # Re-sync the volume with the lockfile on start (fast when nothing changed).
    command: sh -c "pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0"

  test:
    <<: *spotcraft
    profiles: [test]
    build:
      context: .
      target: dev
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: sh -c "pnpm install --frozen-lockfile && pnpm check && pnpm typecheck && pnpm test"

volumes:
  node_modules:

networks:
  # Created by `pnpm exec spotcraft dev`: `<stack>_default`, where `spotcraft dev status` prints
  # the stack's name. Set SPOTCRAFT_DEV_NETWORK in .env when it isn't the default below (a stack
  # made by spotcraft 0.6.1 or later has a hash in its name).
  spotcraft:
    name: ${SPOTCRAFT_DEV_NETWORK:-spotcraft-dev-vinskiano_default}
    external: true
