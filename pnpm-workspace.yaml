# pnpm settings (pnpm reads these here, not from .npmrc or package.json).

# Supply-chain safety
minimumReleaseAge: 1440 # never install a release younger than one day
# Spotcraft is our own deploy platform, published from vindotski/spotcraft by CI with
# provenance; the app pins the Spotcraft version it deploys to, so it can't wait a day.
minimumReleaseAgeExclude:
  - "@spotcraft/kit"
  - spotcraft
trustPolicy: no-downgrade # fail if a package's publishing trust level drops
blockExoticSubdeps: true # transitive deps must come from the registry
strictDepBuilds: true # fail on unreviewed install scripts

# Packages allowed (true) or denied (false) to run install scripts
allowBuilds: {}

# What dependencies may do beyond installing files. `skills`: agent skills a
# package ships, linked into .claude/skills (version-matched, gitignored there).
permissions:
  "@tanstack/react-router":
    skills: [react-router]
  "@tanstack/react-start":
    skills: [react-start]
  # Available on demand through TanStack Intent; no need to auto-load it.
  "@tanstack/devtools-vite":
    skills: false

skills:
  dirs: [.claude/skills]
